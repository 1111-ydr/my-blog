baseURL = "https://liuwenwen.github.io/my-blog/"
langguageCode = "en-us"
title = "Wenwen's Blog"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false

[pagination]
  pagerSize = 10


[outputs]
  home = ["HTML" , "RSS" , "JSON"]

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  Tocopen = false
  fuseopts = { isCaseSensitive = false, shouldSort = true, location = 0, distance = 1000, threshold = 0.4, minMatchCharLength = 0, keys = ["title", "permalink", "summary", "content"] }

[params.homeInfoParams]
  Title = "Hi, I'm Wenwen Liu"
  Content = "Undergraduate majoring in Water Supply and Drainage Science and Engineering. Currently learning Linux and System Administration."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/liuwenwen"

